  p.workers=Math.max(0,Math.min(CFG.maxWorkers,Math.floor(+pl.workers||0)));
  p.plan={pick:Math.max(0,Math.min(PRODUCTS.length-1,Math.floor(+pl.pick||0))),improve:!!pl.improve,superOn:pl.superOn!==false,peeked:!!pl.peeked,buys,wentPublic:!!pl.wentPublic,start};
}
async function hostSettle(force){
  if(MP.settling)return;MP.settling=true;
  try{const plans=await mpCall("mp_host_plans",{p_round:MP.remote.round});
    S=clone(MP.remote);delete S.cfg;S.turn=myIdx();
    S.players.forEach((p,i)=>{delete p.mpPlanned;const got=plans.find(x=>idxOfSeat(x.seat)===i);if(got)applyPlan(p,got.plan);else if(force)botPlan(p)});
    if(!S.players.every(p=>p.plan)){MP.settling=false;return}
    settle();await mpPush();
  }catch(e){toast(e.message,"bad")}
  MP.settling=false;
}
/* hook the League engine */
{const f=nextPlanner;nextPlanner=function(){if(!MP.active)return f();
  S.players.forEach(p=>{delete p.mpPlanned;delete p.plan});S.screen="plan";mpPush().then(()=>mpApply(clone(MP.remote))).catch(e=>toast(e.message,"bad"))}}
{const f=lockIn;lockIn=async function(){if(!MP.active)return f();
  const p=cur(),plan={pick:S.pick,improve:S.improve,superOn:S.superOn,peeked:S.peeked,buys:S.buys,wentPublic:S.wentPublic,workers:p.workers};
  S.screen="waiting";p.mpPlanned=true;render();
  try{mpSet(await mpCall("mp_plan",{p_round:S.round,p_plan:plan}));SFX.chip();render();mpTick()}catch(e){toast(e.message,"bad");S.screen="turn";render()}}}
{const f=toEvent;toEvent=function(){if(MP.active&&!MP.host)return;f();if(MP.active)mpPush().catch(e=>toast(e.message,"bad"))}}
{const f=nextRound;nextRound=function(){if(MP.active&&!MP.host)return;if(MP.active&&S.round>=CFG.rounds){S.screen="end";render();mpPush("done").catch(()=>{});return}f()}}
/* waiting screen + host-only buttons */
VIEWS.waiting=function(){
  const pl=MP.view?MP.view.players:[],waiting=pl.filter(p=>!p.planned);
  return `<div class="screen">${topBar()}${board()}<div class="felt pass"><div class="av">${ic("check")}</div>
   <div class="eyebrow">Round ${S.round} · Plan locked in</div><h2>Waiting for ${waiting.length?waiting.map(p=>esc(p.name)).join(", "):"market day"}</h2>
   <div class="mp-chips">${pl.map(p=>`<span class="mp-chip ${p.planned?"ok":""}">${ic(p.planned?"check":"moon")} ${esc(p.name)}</span>`).join("")}</div>
   ${MP.host&&waiting.length?`<button class="btn btn-ghost" data-a="mpForce">${ic("bot")} Let the CPU plan for anyone still waiting</button>`:""}</div></div>`;
};
A.mpForce=function(){if(MP.host)hostSettle(true)};
const waitHost=t=>`<div class="mp-wait">${ic("moon")} Waiting for ${esc(MP.view?.room.host||"the host")} to ${t}</div>`;
{const f=VIEWS.market;VIEWS.market=function(){let h=f();if(MP.active&&!MP.host)h=h.replace(/<button class="btn btn-gold btn-lg" data-a="next">[\s\S]*?<\/button>/,waitHost("flip the event card"));return h}}
{const f=VIEWS.event;VIEWS.event=function(){let h=f();if(MP.active&&!MP.host)h=h.replace(/<button class="btn btn-gold btn-lg" data-a="round">[\s\S]*?<\/button>/,waitHost("start the next round"));return h}}
{const f=VIEWS.end;VIEWS.end=function(){
  if(MP.active&&!S.mpPaid){S.mpPaid=true;S.rewarded=true;S.reward=0;const key="bbbl-mp-paid-"+MP.code+"-"+MP.ver;
    if(!lsGet(key)){const ranked=[...S.players].sort((a,b)=>score(b)-score(a)),mine=S.players[myIdx()];
      if(mine){S.reward=Math.max(0,score(mine)*10)+(ranked[0]===mine?250:0);if(S.reward)bank(S.reward);me().league=Math.max(me().league||0,score(mine));saveW();lsSet(key,"1")}}}
  let h=f();if(MP.active)h=h.replace(/<div class="row-c"><button class="btn btn-gold btn-lg" data-a="again">[\s\S]*$/,`<div class="row-c"><button class="btn btn-gold btn-lg" data-a="mpLeave">${ic("home")} Back to online lobby</button></div></div>`);
  return h}}
{const f=A.quitYes;A.quitYes=function(){if(MP.active){A.mpLeave();ui.drawer=null;renderLayer();return}f()}}
/* online lobby */
Object.assign(A,{
  async mpCreate(){if(!ACC)return A.go("account");MP.err="";MP.busy=true;render();try{mpSet(await rpc("mp_create",{p_token:ACC.token}));mpStartPolling()}catch(e){MP.err=e.message}MP.busy=false;render()},
  async mpJoin(){if(!ACC)return A.go("account");const c=(document.getElementById("mpCode")?.value||"").trim().toUpperCase();if(c.length<5){MP.err="Room codes are 5 characters.";render();return}
    MP.err="";MP.busy=true;render();try{mpSet(await rpc("mp_join",{p_token:ACC.token,p_code:c}));mpStartPolling();SFX.chip()}catch(e){MP.err=e.message}MP.busy=false;render()},
  async mpType(t){try{mpSet(await mpCall("mp_type",{p_type:t}));SFX.chip();render()}catch(e){toast(e.message,"bad")}},
  async mpLeave(){const c=MP.code;try{if(c&&ACC)await mpCall("mp_leave")}catch(e){}mpStop();S.screen="home";A.go("online");render()},
  async mpStart(){if(!MP.host)return;const pl=MP.view.players;if(pl.length<2){toast("You need at least 2 players.","bad");return}
    try{CFG=Object.assign({},DEF,JSON.parse(lsGet("bbbl-cfg4")||"null")||{})}catch(e){}
    S.seats=pl.map(p=>({name:p.name,bot:false,type:p.type}));S.seatList=pl.map(p=>p.seat);MP.active=true;MP.remote={};newGame()},
  mpCopy(){const c=MP.code;try{navigator.clipboard.writeText(c).then(()=>toast(`Copied ${c}`),()=>toast(`Room code: ${c}`))}catch(e){toast(`Room code: ${c}`)}}
});
function online(){
  if(!ACC)return `<div class="screen">${cHead()}<section class="felt auth"><div class="av">${ic("wifi")}</div><h2>Play online</h2>
    <p class="mute" style="margin:0">Play the Business League against friends on their own phones. You need an account so everyone can see who's who.</p>
    <button class="btn btn-gold btn-lg" data-a="go" data-v="account">${ic("userplus")} Sign up or log in</button></section></div>`;
  if(!MP.code)return `<div class="screen">${cHead()}
   <div class="game-head"><button class="btn btn-ghost sm" data-a="go" data-v="home">${ic("home")} Lobby</button><h2>Play online</h2><span class="mute">Business League with friends, each on their own device</span></div>
   <div class="grid2 even">
    <section class="felt mp-box"><div class="av">${ic("crown")}</div><h3>Host a game</h3><p class="mute">Create a room and share the code. You start the game once everyone's in.</p>
     <button class="btn btn-gold btn-lg" data-a="mpCreate" ${MP.busy?"disabled":""}>${ic("plus")} Create room</button></section>
    <section class="felt mp-box"><div class="av">${ic("users")}</div><h3>Join a game</h3><p class="mute">Got a code from a mate? Type it in.</p>
     <form class="addp" onsubmit="event.preventDefault();A.mpJoin()"><input id="mpCode" maxlength="5" autocomplete="off" placeholder="ABCDE" aria-label="Room code" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--f-num)"><button class="btn btn-gold" type="submit" ${MP.busy?"disabled":""}>${ic("login")} Join</button></form></section>
   </div>${MP.err?`<div class="auth-err" style="margin-top:14px">${ic("alert")} ${esc(MP.err)}</div>`:""}
   <p class="fine">Everyone plans in secret on their own device, then market day reveals all the plans together. Winners earn Butla Bucks.</p></div>`;
  const v=MP.view,mine=v.players.find(p=>p.seat===MP.seat);
  return `<div class="screen">${cHead()}
   <div class="game-head"><button class="btn btn-ghost sm" data-a="mpLeave">${ic("logout")} ${MP.host?"Close room":"Leave"}</button><h2>Room lobby</h2></div>
   <section class="felt room-code"><div class="eyebrow">Room code</div><div class="code num">${esc(MP.code)}</div>
    <button class="btn btn-ghost sm" data-a="mpCopy">${ic("copy2")} Copy code</button><p class="mute" style="margin:0;font-size:13px">Friends go to Play online, tap Join and enter this code.</p></section>
   <section class="felt" style="margin-top:16px"><div class="sec-h"><h3>Players</h3><span class="mute">${v.players.length} of 4</span></div>
    <div class="mp-list">${v.players.map(p=>`<div class="mp-row ${p.seat===MP.seat?"me":""}"><span class="dot" style="background:${SEAT_COLORS[p.seat]}"></span><b>${esc(p.name)}</b>${p.host?`<span class="chip gold">Host</span>`:""}<span class="tag">${ic(typeOf(p.type).icon)} ${typeOf(p.type).name}</span></div>`).join("")}
     ${Array.from({length:4-v.players.length},()=>`<div class="mp-row empty">${ic("moon")} Waiting for a player</div>`).join("")}</div></section>
   <section class="felt" style="margin-top:16px"><div class="sec-h"><h3>Your business</h3></div>
    <div class="types">${TYPES().map(t=>`<button class="type ${mine&&mine.type===t.id?"on":""}" data-a="mpType" data-v="${t.id}"><span class="t">${ic(t.icon)} ${t.name}</span><span class="cost">Start ${money(t.start)} · Register ${money(t.reg)}</span><small>${t.tax}.</small><small>${t.perk}.</small></button>`).join("")}</div></section>
   <div class="row-c">${MP.host?`<button class="btn btn-gold btn-lg" data-a="mpStart" ${v.players.length<2?"disabled":""}>${ic("play")} ${v.players.length<2?"Waiting for players":"Start the game"}</button>`:waitHost("start the game")}</div></div>`;
}
ROUTES.push("online");CV.online=online;
GAMES.splice(1,0,{v:"online",name:"League Online",icon:"wifi",art:"on",line:"Play the Business League against friends, each on their own device.",tag:"2-4 players"});
{const f=restoreSession;restoreSession=async function(){await f();const c=lsGet("bbbl-room");if(ACC&&c){MP.code=c;try{mpSet(await mpCall("mp_get"));mpStartPolling();mpTick()}catch(e){mpStop()}}}}

let lastScreen=null;
function render(){
  const app=document.getElementById("app"),key=APP.view==="league"?"L"+S.screen:APP.view;
  const same=key===lastScreen,y=typeof window!=="undefined"?window.scrollY:0;
  if(app.classList)app.classList.toggle("still",same);
  if(same&&app.style)app.style.minHeight=app.offsetHeight+"px";
  const keepWheel=APP.view==="roulette"&&RL.spinning?document.querySelector(".wheel-wrap .wheel"):null;
  app.innerHTML=APP.view==="league"?VIEWS[S.screen]():CV[APP.view]();
  if(keepWheel){const nw=document.querySelector(".wheel-wrap .wheel");if(nw)nw.replaceWith(keepWheel)}
  if(same){if(window.scrollY!==y)window.scrollTo(0,y);requestAnimationFrame(()=>{if(app.style)app.style.minHeight=""})}
  const bc=document.getElementById("bigcash");
  if(bc){const k="bc"+S.round+"-"+S.turn;if(!done.has(k)){done.add(k);countUp(bc,+bc.dataset.from,+bc.dataset.to,1500)}else bc.textContent=money(+bc.dataset.to);
    bc.style.color=+bc.dataset.to<0?"var(--loss)":"var(--cream)"}
  const sk=APP.view==="league"?"L"+S.screen:APP.view;if(sk!==lastScreen)window.scrollTo({top:0});
  lastScreen=sk;afterRender();
}
function countUp(el,a,b,delay){setTimeout(()=>{const t0=performance.now(),d=900;const tick=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=money(Math.round(a+(b-a)*e));if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)},delay)}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const cols=["#ffdd85","#e8b647","#c8902a","#58c98a","#f4ecd6"];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.2,w:6+Math.random()*6,h:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
   if(t-t0<4200)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);c.hidden=true}})(t0);
}
function boot(data){if(data&&data.S&&data.v===4){S=data.S;(data.done||[]).forEach(d=>done.add(d))}route();renderLayer();if(typeof fetch==="function")restoreSession()}
window.claude?.hot?.snapshot?.(()=>({v:4,S:{...S,evRes:null,screen:S.screen==="event"?"home":S.screen},done:[...done]}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
