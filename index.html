<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Big Butla Business League: build a business, hire workers, read the customers and beat the tax man. Play the card game online.">
<link rel="icon" type="image/webp" href="logo.webp">
<meta property="og:title" content="Big Butla Business League">
<meta property="og:image" content="logo.webp">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Big Butla Business League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a dark card table lit from above. One column of "felt" panels, cards dealt into hands, scoreboard rail on top. */
:root{
  --ink:#0b0a07; --panel:#15130d; --panel2:#1c1910; --line:#2e2817; --gold:#e8b647; --gold-hi:#ffdd85; --gold-lo:#8a6514;
  --cream:#f4ecd6; --mute:#a0957a; --money:#58c98a; --loss:#ef6a58;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;--f-card:"Anton",Impact,"Arial Narrow",sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{background:var(--ink);color:var(--cream);font:15px/1.5 var(--f-body);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(1100px 520px at 50% -120px,#3a2c0b 0,#1a1408 45%,transparent 75%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:8px}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mute{color:var(--mute)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:15px;letter-spacing:.01em;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#c8902a);color:#1a1205;box-shadow:0 1px 0 #fff6 inset,0 6px 20px -6px #e8b64799}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 1px 0 #fff6 inset,0 12px 28px -8px #e8b647cc}
.btn-gold:active{transform:translateY(1px)}
.btn-ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--gold-lo);color:var(--gold-hi)}
.btn-lg{padding:16px 30px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.35;pointer-events:none}
.icon-btn{width:40px;height:40px;padding:0;border-radius:10px}

/* Panels */
.felt{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h3{font-size:22px}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;padding-block:48px 28px}
.hero-logo{width:min(440px,100%);height:auto;max-width:100%;justify-self:center;animation:logoIn 1s cubic-bezier(.2,1.3,.4,1) both;filter:drop-shadow(0 20px 50px #e8b64733)}
.hero h1{font-size:clamp(44px,7vw,84px);line-height:.95;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#b07d1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 span{display:block;color:var(--cream);-webkit-text-fill-color:var(--cream);font-size:.5em;letter-spacing:.12em;margin-top:8px}
.hero p{font-size:17px;color:var(--mute);max-width:44ch;margin:18px 0 26px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);animation:rise .6s both;animation-delay:calc(var(--i)*70ms + 300ms)}
.step .n{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#e8b6471a;color:var(--gold);font-size:20px}
.step b{font-size:15px}.step span{font-size:13.5px;color:var(--mute)}
.step small{font-family:var(--f-num);font-size:11px;color:var(--gold-lo);grid-column:2}

/* Top bar */
.top{display:flex;align-items:center;gap:14px;padding-block:16px;flex-wrap:wrap}
.top img{width:54px;height:auto}
.top .ttl{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;line-height:1}
.top .ttl small{display:block;font-family:var(--f-body);font-size:12px;color:var(--mute);letter-spacing:0;margin-top:4px}
.pips{display:flex;gap:6px;margin-left:auto;align-items:center}
.pip{width:28px;height:6px;border-radius:3px;background:var(--line);transition:background .4s}
.pip.done{background:var(--gold-lo)}.pip.now{background:var(--gold);box-shadow:0 0 12px #e8b64799}

/* Scoreboard */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.seat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);transition:border-color .3s,box-shadow .3s,transform .3s}
.seat.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 10px 30px -14px #e8b647aa;transform:translateY(-2px)}
.seat-h{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}
.seat-h .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat-h .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--mute);display:flex;gap:4px;align-items:center;white-space:nowrap}
.seat .cash{font-family:var(--f-num);font-size:22px;font-weight:700;margin:4px 0 6px}
.seat .cash.neg{color:var(--loss)}
.stats{display:flex;gap:12px;font-size:13px;color:var(--mute)}
.stats span{display:flex;align-items:center;gap:4px}
.stats b{color:var(--cream);font-family:var(--f-num);font-weight:700}
.stats .st b{color:var(--gold-hi)}

/* Cards */
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;perspective:1000px}
.card{--w:132px;width:var(--w);aspect-ratio:5/7;max-width:100%;position:relative;border-radius:14px;flex:none}
.card .face{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 10px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(165deg,#2a2413,#141109 70%);border:1.5px solid var(--gold-lo);box-shadow:0 10px 24px -10px #000}
.front .big{font-size:42px;color:var(--gold)}
.front b{font-size:14px;line-height:1.2}
.front small{font-size:11.5px;color:var(--mute);line-height:1.35}
.front .corner{position:absolute;top:8px;left:10px;font-family:var(--f-num);font-size:11px;color:var(--gold);display:flex;flex-direction:column;align-items:center;gap:2px}
.front .corner.br{top:auto;left:auto;bottom:8px;right:10px;transform:rotate(180deg)}
.back{background:var(--ink);border:1.5px solid var(--gold-lo);background-image:repeating-linear-gradient(45deg,#e8b64712 0 2px,transparent 2px 10px),repeating-linear-gradient(-45deg,#e8b64712 0 2px,transparent 2px 10px)}
.back .seal{width:62%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--gold-lo);display:grid;place-items:center;font-size:34px;color:var(--gold);background:var(--ink)}
.back .lbl{position:absolute;bottom:12px;font-size:10px;letter-spacing:.2em;color:var(--gold-lo);font-weight:800}
.pickable{cursor:pointer;transition:transform .3s cubic-bezier(.2,1.2,.4,1),filter .3s;animation:deal .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*70ms)}
.pickable:hover{transform:translateY(-8px)}
.pickable.sel{transform:translateY(-16px) scale(1.04)}
.pickable.sel .front{border-color:var(--gold-hi);box-shadow:0 0 0 2px var(--gold) inset,0 18px 40px -12px #e8b647aa}
.pickable .check{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1a1205;display:grid;place-items:center;font-size:16px;transform:scale(0);transition:transform .3s cubic-bezier(.2,1.6,.4,1);z-index:2}
.pickable.sel .check{transform:scale(1)}
.flipper .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.25,.45,1)}
.flipper .front{transform:rotateY(180deg)}
.flipper.flipped .inner{transform:rotateY(180deg)}
.front.good{border-color:#58c98a99}.front.good .big{color:var(--money)}
.front.bad{border-color:#ef6a5899}.front.bad .big{color:var(--loss)}

/* Turn layout */
.turn-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.turn-head h2{font-size:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mute)}
.chip.gold{color:var(--gold);border-color:var(--gold-lo)}
.grid2{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px}
.stack{display:grid;gap:16px}
.market{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.market p{margin:0;font-size:13.5px}
.stepper-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stepper{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:#0e0d09}
.stepper .h{display:flex;align-items:center;gap:8px;font-weight:800}
.stepper .h .ic{color:var(--gold);font-size:18px}
.stepper .ctl{display:flex;align-items:center;gap:12px}
.stepper .val{font-family:var(--f-num);font-size:28px;font-weight:700;min-width:2ch;text-align:center}
.stepper small{color:var(--mute);font-size:12.5px}
.summary{position:sticky;bottom:12px;margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:#0b0a07ee;border:1px solid var(--gold-lo);backdrop-filter:blur(8px);box-shadow:0 20px 40px -20px #000;z-index:5}
.summary .figs{display:flex;gap:20px;flex-wrap:wrap;flex:1;min-width:0}
.summary .figs div{display:grid;font-size:12px;color:var(--mute)}
.summary .figs b{font-family:var(--f-num);font-size:17px;color:var(--cream)}
.summary .figs b.g{color:var(--money)}

/* Results */
.reveal{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;perspective:1200px}
.reveal .card{--w:160px}
.reveal .cap{text-align:center;font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--mute);margin-top:10px;text-transform:uppercase}
.ledger{max-width:520px;margin:22px auto 0;display:grid;gap:2px}
.ledger .ln{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--line);animation:rise .45s both;animation-delay:calc(var(--i)*180ms + 500ms)}
.ledger .ln span:last-child{font-family:var(--f-num);font-weight:700;white-space:nowrap}
.ledger .tot{border-bottom:0;border-top:1.5px solid var(--gold-lo);margin-top:4px;padding-top:12px;font-weight:800}
.pos{color:var(--money)}.neg{color:var(--loss)}
.bigcash{text-align:center;margin-top:18px}
.bigcash .num{font-size:44px;font-weight:700}
.float{position:fixed;pointer-events:none;font-family:var(--f-num);font-weight:700;font-size:22px;z-index:50;animation:floatUp 1.6s ease-out forwards}

/* Pass screen */
.pass{display:grid;place-items:center;text-align:center;gap:18px;padding-block:60px}
.pass .av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:var(--gold);border:1.5px solid var(--gold-lo);background:var(--panel);animation:pulse 2.4s ease-in-out infinite}
.pass h2{font-size:44px}

/* Setup */
.seats{display:grid;gap:14px}
.seat-cfg{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center;animation:rise .45s both}
.seat-cfg .who{display:grid;gap:8px}
.seat-cfg input{width:100%;background:#0e0d09;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--cream);font:inherit;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--gold);color:#1a1205}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.type{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0e0d09;text-align:left;display:grid;gap:4px;transition:border-color .2s,transform .2s,box-shadow .2s}
.type:hover{border-color:var(--gold-lo);transform:translateY(-2px)}
.type.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.type .t{display:flex;align-items:center;gap:8px;font-weight:800}
.type .t .ic{color:var(--gold);font-size:18px}
.type small{font-size:12px;color:var(--mute);line-height:1.4}
.type .cost{font-family:var(--f-num);font-size:12px;color:var(--gold)}

/* End */
.podium{display:grid;gap:10px}
.rank{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);animation:rise .5s both;animation-delay:calc(var(--i)*150ms + 400ms)}
.rank.first{border-color:var(--gold);background:linear-gradient(90deg,#e8b64722,var(--panel) 60%)}
.rank .pos{font-family:var(--f-display);font-size:30px;color:var(--gold);text-align:center}
.rank .brk{font-size:12.5px;color:var(--mute)}
.rank .sc{font-family:var(--f-num);font-size:24px;font-weight:700}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:480px;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* Drawer */
.scrim{position:fixed;inset:0;background:#000a;z-index:60;animation:fade .25s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:61;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow-y:auto;animation:slideIn .35s cubic-bezier(.2,.9,.3,1) both}
.drawer h3{font-size:26px}
.fields{display:grid;gap:10px;margin:16px 0}
.fields .grp{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--gold);margin-top:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.field input{width:100%;background:#0e0d09;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--cream);font-family:var(--f-num);text-align:right}
.rules-list{display:grid;gap:12px;margin-top:14px}
.rules-list div{display:grid;grid-template-columns:36px 1fr;gap:12px;font-size:14px}
.rules-list .ic{font-size:20px;color:var(--gold);margin-top:2px}
.rules-list b{display:block}
.rules-list span{color:var(--mute)}

.screen{animation:screenIn .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes deal{from{opacity:0;transform:translateY(-120px) rotate(-14deg) scale(.7)}}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-14deg)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.8)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px #e8b64714,0 0 40px #e8b64733}}
@keyframes fade{from{opacity:0}}
@keyframes slideIn{from{transform:translateX(100%)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.shake{animation:shake .4s}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:20px;padding-top:28px;text-align:center}
  .hero p{margin-inline:auto}.hero-ctas{justify-content:center}
  .hero-logo{width:min(320px,86%)}
  .steps{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .seat-cfg{grid-template-columns:1fr}
}
@media (max-width:520px){
  .steps{grid-template-columns:1fr}
  .types{grid-template-columns:1fr}
  .stepper-row{grid-template-columns:1fr}
  .card{--w:104px}.reveal .card{--w:120px}
  .front .big{font-size:32px}
  .pips .pip{width:16px}
  .board{grid-template-columns:1fr 1fr}
  .seat .cash{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.screen,.tile,.step,.fan,.hero-logo,.lobby-logo,.rise,.feed-row,.rw-card,.mp-row,.pod,.sheet td,.tile-art::before,.dot-ready,.live-pill i,.online-dot,.btn.pulse,.pass .av,.wallet.up,.wallet.down{animation:none!important}.tile,.tile-art::before{transition:none!important}}
/* Category bands echo the printed card colours */
:root{--c-cust:#e0784c;--c-prod:#58b27a;--c-event:#a983d6;--c-act:#e8b647;--c-biz:#6f9fd0}
.front{justify-content:flex-start;padding-top:0}
.front .band{align-self:stretch;margin:0 -10px 4px;padding:6px 10px;display:flex;justify-content:space-between;font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cc,var(--gold));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--cc,var(--gold)) 10%,transparent)}
.front .big{margin-top:auto;color:var(--cc,var(--gold))}
.front b{margin-bottom:auto}.front small+.ctag,.front b+.ctag{margin-top:0}
.front .ctag{font-style:normal;font-size:10.5px;font-weight:800;align-self:stretch;padding:5px 4px;border-radius:7px;background:color-mix(in srgb,var(--cc,var(--gold)) 18%,transparent);color:var(--cc,var(--gold))}
.front small{margin-bottom:6px}
.cat-cust{--cc:var(--c-cust)}.cat-prod{--cc:var(--c-prod)}.cat-event{--cc:var(--c-event)}.cat-act{--cc:var(--c-act)}.cat-biz{--cc:var(--c-biz)}
.front.good{border-color:#58c98a}.front.bad{border-color:#ef6a58aa}
.front.good .big,.front.bad .big{color:var(--cc)}
.card.sm{--w:112px}.card.sm .front .big{font-size:30px}.card.sm .front b{font-size:12.5px}
.card.lg{--w:200px}.card.lg .front .big{font-size:56px}.card.lg .front b{font-size:18px}.card.lg .front small{font-size:13px}
button.card{padding:0;border:0;background:none;color:inherit;text-align:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.faceup{margin-top:8px;font-size:12px;color:var(--gold);display:flex;gap:6px;align-items:center}
.prod-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.seg-group{border:1px dashed transparent;border-radius:14px;padding:8px 4px 12px;transition:border-color .3s,background .3s}
.seg-group.hot{border-color:var(--gold-lo);background:#e8b6470d}
.seg-h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 10px 6px;display:flex;align-items:center;gap:8px}
.seg-group .hand{gap:8px;justify-content:flex-start;padding-left:4px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.toggle{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;background:#0e0d09;transition:border-color .2s}
.toggle:hover{border-color:var(--gold-lo)}.toggle.on{border-color:var(--gold)}
.toggle:disabled{cursor:default;opacity:.75}
.toggle b{display:flex;align-items:center;gap:6px}.toggle small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;margin-top:1px;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .3s cubic-bezier(.2,1.4,.4,1),background .25s}
.toggle.on .sw{background:#e8b64755}.toggle.on .sw::after{transform:translateX(16px);background:var(--gold-hi)}
.row-end{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.row-c{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.effects{max-width:560px;margin:22px auto 6px;display:grid;gap:8px}
.eff{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#0e0d09;animation:rise .45s both;animation-delay:calc(var(--i)*150ms + 1100ms)}
.eff .mute{font-size:13px}.eff .num{font-weight:700}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.table-box{overflow-x:auto}
.sheet{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.sheet th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:800;text-align:right;padding:8px;border-bottom:1px solid var(--line)}
.sheet td{padding:12px 8px;text-align:right;font-family:var(--f-num);border-bottom:1px solid var(--line);animation:rise .5s both;animation-delay:calc(var(--i)*150ms + 300ms)}
.sheet th:first-child,.sheet td:first-child{text-align:left;font-family:var(--f-body);font-weight:700}
.sheet td:first-child .dot{margin-right:8px}
.sheet tr.first td{color:var(--gold-hi)}.sheet td b{font-size:17px}
.deck-peek{padding-block:10px 20px}
.fan{animation:deal .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*110ms + 500ms);transform:rotate(calc((var(--i) - 1.5)*4deg)) translateY(calc(var(--i)*0px));transition:transform .3s}
.fan:hover{transform:translateY(-10px) rotate(0)}
@media (max-width:980px){.prod-grid{grid-template-columns:1fr}}
@media (max-width:820px){.grid2.even{grid-template-columns:1fr}}
@media (max-width:520px){.card.sm{--w:96px}.card.lg{--w:170px}.eff{grid-template-columns:auto minmax(0,1fr) auto}.eff .mute{grid-column:2}.eff .num{grid-row:1;grid-column:3}}
/* ===== Card design v2: gold-foil collectible cards ===== */
.card{font-size:calc(var(--w) * .1)}
.card .face{padding:calc(var(--w) * .035);border:0;border-radius:calc(var(--w) * .075);gap:0;
  background:linear-gradient(145deg,#fbe39a 0%,#c4922e 22%,#f7da86 45%,#8c6216 70%,#e9bb52 100%);box-shadow:0 .9em 1.8em -.8em #000,0 .2em .5em #0008}
.cf,.cb{position:relative;width:100%;height:100%;border-radius:calc(var(--w) * .05);overflow:hidden}
.cf{display:flex;flex-direction:column;gap:.38em;padding:.5em .5em .55em;text-align:center;
  background:radial-gradient(130% 70% at 50% 0%,color-mix(in srgb,var(--cc) 26%,#16130c) 0%,#0e0c08 62%),#0e0c08;box-shadow:inset 0 0 0 1px #00000080}
.cf-rib{display:flex;justify-content:space-between;align-items:center;font-size:.6em;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--cc)}
.cf-rib span{display:flex;align-items:center;gap:.4em}.cf-rib .ic{font-size:1.25em;stroke-width:2.2}
.cf-mono{color:var(--gold);opacity:.8}
.cf-art{position:relative;flex:1 1 auto;min-height:3.4em;border-radius:.55em;display:grid;place-items:center;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--cc) 50%,transparent);
  background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--cc) 38%,transparent) 0%,transparent 62%),
    repeating-conic-gradient(from 0deg at 50% 55%,color-mix(in srgb,var(--cc) 12%,transparent) 0deg 9deg,transparent 9deg 18deg),#0a0906;
  box-shadow:inset 0 0 1.4em #000c}
.cf-art .ic{font-size:3.1em;color:color-mix(in srgb,var(--cc) 70%,#fff);stroke-width:1.5;filter:drop-shadow(0 0 .25em color-mix(in srgb,var(--cc) 75%,transparent))}
.cf-stamp{position:absolute;top:.45em;right:-1.9em;transform:rotate(35deg);width:7em;padding:.2em 0;font-size:.55em;font-weight:900;letter-spacing:.2em;text-transform:uppercase;background:var(--money);color:#06210f;z-index:1}
.front.bad .cf-stamp{background:var(--loss);color:#2a0905}
.cf-title{font-family:var(--f-display);font-size:1.12em;line-height:1.02;letter-spacing:.03em;text-transform:uppercase;color:var(--cream);text-wrap:balance}
.cf-text{font-size:.74em;line-height:1.3;color:#c9bfa5;text-wrap:balance}
.cf-tag{font-size:.68em;font-weight:800;line-height:1.2;padding:.45em .3em;border-radius:.45em;color:#120f08;
  background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 82%,#fff),var(--cc))}
.front.good .cf{box-shadow:inset 0 0 0 2px var(--money)}.front.bad .cf{box-shadow:inset 0 0 0 2px #ef6a58aa}
/* foil sheen */
.front::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:linear-gradient(110deg,transparent 30%,#ffffff2e 45%,#fff6d955 50%,#ffffff2e 55%,transparent 70%);background-size:280% 100%;background-position:var(--mx,140%) 0;transition:background-position .7s ease;mix-blend-mode:screen}
.flipper.flipped .front::after{animation:sheen 1.4s .55s ease both}
@keyframes sheen{from{background-position:140% 0}to{background-position:-40% 0}}
/* card back */
.cb{display:grid;place-items:center;align-content:center;gap:.5em;background:
  repeating-radial-gradient(circle at 50% 50%,#e8b6471a 0 1px,transparent 1px .55em),
  repeating-conic-gradient(from 0deg,#e8b6470d 0 5deg,transparent 5deg 10deg),#0b0a07;
  box-shadow:inset 0 0 0 .3em #0b0a07,inset 0 0 0 calc(.3em + 1px) var(--gold-lo),inset 0 0 2em #000}
.cb .seal{width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:2.2em;color:var(--gold-hi);border:0;
  background:radial-gradient(circle,#1d170a 58%,transparent 60%),linear-gradient(145deg,#fbe39a,#a8781f 50%,#f2cf74);box-shadow:0 0 1.4em #e8b64740}
.cb .seal .ic{stroke-width:1.6}
.cb-word{font-family:var(--f-display);font-size:1.15em;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(180deg,var(--gold-hi),#b8862a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cb .lbl{position:static;font-size:.55em;letter-spacing:.3em;color:var(--gold-lo);font-weight:800}
/* tilt + lift */
.tilt{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) rotate(var(--rot,0deg)) scale(var(--sc,1));transition:transform .25s cubic-bezier(.2,1.2,.4,1)}
.pickable.tilt:hover{--ty:-8px}.pickable.tilt.sel{--ty:-14px;--sc:1.05}
.pickable.sel .front{border:0;box-shadow:0 0 0 3px var(--gold-hi),0 1.2em 2.4em -.8em #e8b647aa}
.fan.tilt{--rot:calc((var(--i) - 1.5) * 4deg)}.fan.tilt:hover{--ty:-12px;--rot:0deg;z-index:2}
.deck-peek .card{--w:150px}
.reveal .card{--w:168px}.card.lg{--w:220px}
@media (max-width:520px){.deck-peek .card{--w:118px}.reveal .card{--w:128px}.card.lg{--w:180px}.card.sm{--w:100px}}
.card.sm{--w:100px}.seg-group .hand{flex-wrap:nowrap}
@media (max-width:1100px){.prod-grid{grid-template-columns:1fr}}
@media (max-width:520px){.card.sm{--w:92px}.seg-group .hand{gap:6px}}
.faceup.wait{color:var(--mute)}
.trait-panel{margin-top:16px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0e0d09;font-size:13.5px;color:var(--mute);min-height:52px}
.trait-panel>.ic{font-size:22px;color:var(--c-prod);margin-top:2px}
.trait-panel b{display:block;color:var(--cream);font-size:14px}
.crowd-note{display:flex;gap:8px;align-items:center;justify-content:center;text-align:center;margin:22px auto 8px;font-weight:700;color:var(--gold-hi);animation:rise .45s both}
.crowd-note .ic{font-size:18px}
.sheet.mkt{min-width:640px;margin-top:6px}
.sheet.mkt td{vertical-align:top}
.sheet.mkt td small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--mute);margin-top:3px;max-width:34ch;line-height:1.35}
.sheet .pos{color:var(--money)}.sheet .neg{color:var(--loss)}
.reveal .cap{display:flex;align-items:center;justify-content:center;gap:6px;text-transform:none;letter-spacing:.02em;font-size:13px;color:var(--cream)}
.reveal{gap:14px}
@media (min-width:900px){.reveal .card{--w:150px}}
/* ===================== Casino ===================== */
:root{--felt:#0c2a1e;--felt-hi:#14432f;--rail:#3a2a0e}
.chead{gap:16px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.cnav{display:flex;gap:4px;margin-left:auto}
.cnav button{display:flex;align-items:center;gap:6px;background:none;border:0;padding:9px 12px;border-radius:10px;font-weight:700;color:var(--mute)}
.cnav button:hover{color:var(--cream)}.cnav button.on{color:var(--gold-hi);background:#e8b64714}
.wallet{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;border:1px solid var(--gold-lo);background:linear-gradient(180deg,#221a09,#120f08);color:var(--cream);transition:box-shadow .3s}

.lobby-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:center;padding-block:24px 28px}
.lobby-logo{width:min(300px,100%);height:auto;filter:drop-shadow(0 20px 50px #e8b64733);animation:logoIn 1s cubic-bezier(.2,1.3,.4,1) both}

.tile:hover{transform:translateY(-4px);border-color:var(--gold-lo);box-shadow:0 18px 40px -20px #e8b64788}

.wal-stats div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid}.wal-stats small{font-size:11.5px;color:var(--mute)}.wal-stats b{font-size:18px}

.mini-lb li.me{border-color:var(--gold-lo)}.mini-lb .rk{font-family:var(--f-display);font-size:20px;color:var(--gold);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;background:#1c1910;border:1px solid var(--gold-lo);font-weight:700;box-shadow:0 20px 40px -12px #000;animation:toastIn .4s cubic-bezier(.2,1.3,.4,1) both;max-width:calc(100% - 32px)}

.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}

.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod .num{font-size:20px;font-weight:700;color:var(--gold-hi)}.pod small{color:var(--mute);font-size:11.5px}

.pc-face{display:grid;justify-items:center;gap:0;width:56%;padding:8% 0;border:1.5px solid currentColor;border-radius:6px;background:color-mix(in srgb,currentColor 8%,transparent)}
.pc-face .ic{font-size:calc(var(--w)*.26)}.pc-face b{font-family:var(--f-display);font-weight:400;font-size:calc(var(--w)*.3);line-height:1}
.pc-b{transform:rotateY(180deg);display:grid;place-items:center;border:3px solid #f4ecd6;background:repeating-linear-gradient(45deg,#7a1712 0 4px,#5c100c 4px 8px);box-shadow:inset 0 0 0 3px #c8902a,0 8px 18px -6px #000c}
.pc-b .seal{width:44%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#0b0a07;color:var(--gold-hi);font-size:calc(var(--w)*.22);box-shadow:0 0 0 2px #c8902a}
.pc.deal{animation:dealIn .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes dealIn{from{opacity:0;transform:translate(160px,-200px) rotate(18deg) scale(.8)}}
.pc.ghost{border:2px dashed #f4ecd630;border-radius:9px}
.hand-row{display:flex;justify-content:center;min-height:calc(92px*1.4)}
.hand-row .pc+.pc{margin-left:calc(var(--w)*-.42)}
.bj{display:grid;gap:10px;min-height:520px;align-content:space-between}
.bj-zone{display:grid;justify-items:center;gap:10px;padding:10px;border-radius:16px;transition:background .3s}
.bj-zone.act{background:#e8b64714;box-shadow:inset 0 0 0 1px #e8b64755}
.bj-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#f4ecd6bb}
.tot{display:inline-grid;place-items:center;min-width:36px;padding:3px 10px;border-radius:999px;background:#000b;color:var(--cream);font:800 15px var(--f-num);letter-spacing:0}
.tot.bust{color:var(--loss)}
.res{padding:3px 10px;border-radius:999px;background:#000b;letter-spacing:.04em;text-transform:none;font-size:13px}.res.win{color:var(--money)}.res.lose{color:var(--loss)}
.bj-mid{text-align:center;min-height:52px}
.bj-hands{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
/* roulette */
.rl-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.wheel-wrap{width:min(320px,100%)}.wheel{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 30px #000a)}
#rlWheel,#rlBall{transform-box:view-box;transform-origin:0 0}

.rl-info{display:grid;gap:14px;justify-items:start}
.rl-result{display:flex;align-items:baseline;gap:10px;padding:8px 18px;border-radius:14px;animation:pop .4s both}
.rl-result .num{font-size:52px;font-weight:700;line-height:1}.rl-result small{text-transform:uppercase;letter-spacing:.16em;font-weight:800}
.rl-result.red{background:#b3261e}.rl-result.black{background:#171511;box-shadow:inset 0 0 0 1px #f4ecd633}.rl-result.green{background:#118a4a}
.hist{display:flex;gap:5px;flex-wrap:wrap}.hist .h{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font:700 12px var(--f-num)}
.hist .h.red{background:#b3261e}.hist .h.black{background:#171511;box-shadow:inset 0 0 0 1px #f4ecd633}.hist .h.green{background:#118a4a}
.hist .h:first-child{box-shadow:0 0 0 2px var(--gold-hi)}
.rl-bet{font-size:13px;color:#f4ecd6bb;font-weight:700;text-transform:uppercase;letter-spacing:.12em}.rl-bet b{font-size:20px;color:var(--gold-hi);letter-spacing:0;margin-left:6px}
.board-wrap{overflow-x:auto;margin-top:20px;padding-bottom:4px}
.rl-board{display:grid;grid-template-columns:52px repeat(12,minmax(44px,1fr)) 52px;grid-template-rows:repeat(3,52px) 44px 44px;gap:3px;min-width:700px}
.rl-cell{position:relative;border:0;border-radius:6px;background:#ffffff0d;box-shadow:inset 0 0 0 1px #f4ecd655;color:var(--cream);font-weight:800;font-size:13px;letter-spacing:.04em;display:grid;place-items:center;transition:background .2s,transform .15s}
.rl-cell:hover{background:#ffffff22}.rl-cell:active{transform:scale(.97)}
.rl-cell.num span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font:700 15px var(--f-num)}
.rl-cell.red span{background:#b3261e}.rl-cell.black span{background:#171511}.rl-cell.green span{background:#118a4a}
.rl-cell.zero{background:#118a4a33}
.rl-cell.landed{box-shadow:inset 0 0 0 2px var(--gold-hi),0 0 18px #e8b64799;animation:pulse 1.6s ease-in-out 3}
.rl-cell.hit{background:#58c98a33}
.dia{width:22px;height:22px;transform:rotate(45deg);border-radius:3px}.dia.red{background:#b3261e}.dia.black{background:#171511;box-shadow:0 0 0 1px #f4ecd666}
.stack.on-cell{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;padding:2px 7px 2px 3px;font-size:11.5px;pointer-events:none;animation:pop .3s both;box-shadow:0 4px 10px #000a}
/* slots */
.slot-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.machine{--cell:clamp(78px,11vw,118px);border-radius:28px;padding:20px;background:linear-gradient(180deg,#2a1f0b,#120e07);border:2px solid var(--gold-lo);box-shadow:inset 0 0 0 6px #0b0a07,inset 0 0 0 8px #8a6514,0 30px 60px -30px #000;display:grid;justify-items:center;gap:16px}
.marquee{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:30px;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(180deg,var(--gold-hi),#b07d1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.marquee span{color:var(--gold);display:flex;-webkit-text-fill-color:initial}
.reels-wrap{position:relative;padding:10px;border-radius:18px;background:#0b0a07;box-shadow:inset 0 0 0 2px #8a6514,inset 0 10px 30px #000}
.reels{display:grid;grid-template-columns:repeat(3,var(--cell));gap:8px}
.reel{height:calc(var(--cell)*3);overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#d9cfb5,#fbf6e9 20%,#fbf6e9 80%,#d9cfb5)}
.reel-strip{will-change:transform}.reel-strip.go{transition:transform 1.5s cubic-bezier(.3,.05,.2,1.03)}
.reel:nth-child(2) .reel-strip.go{transition-duration:1.95s}.reel:nth-child(3) .reel-strip.go{transition-duration:2.4s}
.cell{height:var(--cell);display:grid;place-items:center;transition:background .3s}
.cell.win{background:radial-gradient(circle,#ffdd8599,transparent 70%);animation:winPulse 1s ease-in-out 3}
@keyframes winPulse{50%{transform:scale(1.08)}}
.sym{display:grid;place-items:center;font-size:calc(var(--cell)*.52)}
.sym .ic{stroke-width:2}.sym b{font-family:var(--f-display);font-weight:400;font-size:1.1em;line-height:1}
.s-crown{color:#c8902a}.s-seven{color:#b3261e}.s-gem{color:#2f6fd1}.s-trophy{color:#8a6514}.s-dollar{color:#1f8a4c}.s-star{color:#7a3fb0}
.paylines{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none}
.paylines polyline{fill:none;stroke:#ef6a58;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.85;vector-effect:non-scaling-stroke;stroke-dasharray:600;animation:draw .8s ease-out both}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
.slot-msg{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;color:#f4ecd6bb;min-height:30px}.slot-msg.win{color:var(--money)}
.slot-ctl{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:center}
.slot-ctl small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--mute);margin-bottom:6px}
.slot-total b{font-size:26px;color:var(--gold-hi)}
.spin-btn{width:96px;height:96px;border-radius:50%;border:0;display:grid;place-items:center;align-content:center;gap:2px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:#1a1205;background:radial-gradient(circle at 40% 35%,#fff3c4,var(--gold) 55%,#a87515);box-shadow:0 6px 0 #6b4a10,0 14px 30px -8px #e8b647aa;transition:transform .12s}
.spin-btn .ic{font-size:28px;stroke-width:2.4}.spin-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6b4a10}
.spin-btn:disabled{opacity:.5}.spin-btn:not(:disabled):hover .ic{animation:spinI .6s}
@keyframes spinI{to{transform:rotate(360deg)}}
.paytable table{width:100%;border-collapse:collapse}.paytable th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right;padding:6px}
.paytable td{padding:6px;border-top:1px solid var(--line);text-align:right;font-weight:700}.paytable td:first-child{text-align:left;display:flex;gap:2px}
.paytable .sym{font-size:20px;width:26px;height:26px;border-radius:6px;background:#fbf6e9}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.slot-layout{grid-template-columns:1fr}.rl-top{grid-template-columns:1fr;justify-items:center}.rl-info{justify-items:center}}
@media (max-width:640px){.lobby-hero{grid-template-columns:1fr;text-align:center;justify-items:center}.lobby-hero p{margin-inline:auto}.lobby-logo{width:min(220px,70%)}
 .cnav span{display:none}.wal-stats{grid-template-columns:1fr}.pc{--w:72px}.hand-row{min-height:calc(72px*1.4)}.table-felt{padding:14px;border-width:6px;border-radius:20px}.bj{min-height:420px}
 .chip-btn{width:50px;height:50px;font-size:12px}.controls{justify-content:center}}

.readout small{color:var(--mute);font-size:12.5px}.readout b{font-size:18px;color:var(--gold-hi)}.readout b.pos{color:var(--money)}.readout b.neg{color:var(--loss)}

.mtile{aspect-ratio:1;border:0;border-radius:12px;display:grid;place-items:center;font-size:clamp(22px,5vw,38px);background:linear-gradient(180deg,#2b3a33,#1a2620);box-shadow:0 5px 0 #0c1511,inset 0 1px 0 #ffffff22;transition:transform .15s,box-shadow .15s,background .3s}

.mp-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-weight:700;font-size:13px}
.mp-chip.ok{color:var(--money);border-color:#58c98a66}
.mp-wait{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:1px dashed var(--gold-lo);color:var(--gold-hi);font-weight:700}
/* live */
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#ef6a581a;border:1px solid #ef6a5855;color:#ff9a8c;font-weight:800;font-size:12px;letter-spacing:.06em}
.live-pill i,.online-dot{width:7px;height:7px;border-radius:50%;background:#ff5b4a;box-shadow:0 0 8px #ff5b4a;animation:pulseDot 1.4s infinite;display:inline-block}
.online-dot{background:var(--money);box-shadow:0 0 8px var(--money);margin:0 2px 0 4px}
.lc-bar{position:absolute;left:12px;right:12px;top:12px;height:4px;border-radius:999px;background:#ffffff10;overflow:hidden;z-index:2}
.lc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .1s linear}
.cr-mult.wait{color:#f4ecd699;font-size:clamp(40px,7vw,72px)}
.lc-hist{position:absolute;left:16px;right:16px;bottom:44px;justify-content:flex-end;pointer-events:none;opacity:.9}
.lc-list{display:grid;gap:6px;max-height:300px;overflow:auto}
.lc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:#0e0d09;border:1px solid var(--line);font-size:13.5px}
.lc-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lc-row.me{border-color:var(--gold-lo)}
.lc-row .pos{color:var(--money);font-weight:700}.lc-row .neg{color:var(--loss);font-weight:700}
#lcBtn{width:100%}#lcBtn.cash{background:linear-gradient(180deg,#8ff0b4,#3fbf74);box-shadow:0 6px 20px -6px #58c98acc;color:#06210f}
.feed{display:grid;gap:6px}
.feed-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px 12px;align-items:center;padding:9px 12px;border-radius:10px;background:#0e0d09;border:1px solid var(--line);font-size:13.5px;animation:rise .4s both}
.feed-row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.feed-row .pos{color:var(--money);font-weight:700}
.feed-row .mult{color:var(--gold-hi);font-weight:700}.feed-row small{grid-column:1/-1;color:var(--mute);font-size:11px;margin-top:-2px}
#liveFeed{margin-top:16px}
.tiles .tile:first-child{grid-column:span 2}
.tiles .tile:last-child:nth-child(4n+1){grid-column:span 2}
.tiles .tile:nth-child(2){grid-column:span 2}
@media (max-width:900px){.tiles .tile:nth-child(2){grid-column:auto}.tiles .tile:last-child:nth-child(4n+1){grid-column:auto}}
@media (max-width:520px){.tiles .tile{grid-column:auto!important}}
/* no replayed entrance animations when the same screen refreshes */
#app.still .screen,#app.still .tile,#app.still .step,#app.still .mp-row,#app.still .feed-row,#app.still .rw-card,#app.still .pod,#app.still .sheet td,
#app.still .lc-row,#app.still .vip-bar i,#app.still .lobby-logo,#app.still .hero-logo,#app.still .seat-cfg,#app.still .reward,#app.still .pickable,
#app.still .fan,#app.still .ledger .ln,#app.still .eff,#app.still .crowd-note,#app.still .rank,#app.still .bj-msg.idle,#app.still .over-msg,
#app.still .rl-result,#app.still .mini-lb li,#app.still .auth,.still .feed-row{animation:none!important}
img[src^="data:image/webp"]{aspect-ratio:560/537;height:auto}
.top img{width:54px;height:auto;flex:none}
/* ===== Mobile polish ===== */
.lc-hist{top:26px;bottom:auto}
.rl-board.vertical{grid-template-columns:repeat(3,minmax(0,1fr)) 54px 54px;grid-template-rows:44px repeat(12,40px) 40px;min-width:0;max-width:440px;margin:0 auto}
.rl-board.vertical .rl-cell.num span{width:30px;height:30px;font-size:14px}
.rl-cell.vert em{font-style:normal;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;letter-spacing:.06em;white-space:nowrap}
.rl-board.vertical .zero span{width:34px;height:34px}
@media (max-width:640px){
  .top .ttl{display:none}
  .chead{flex-wrap:nowrap;gap:6px;padding-block:12px}
  .chead .brand img{width:44px}
  .cnav{gap:0;margin-left:auto}.cnav button{padding:9px 8px}
  .chead .icon-btn{width:36px;height:36px}
  .wallet{padding:6px 10px 6px 8px;gap:6px}.wallet>.ic{font-size:18px}.wallet b{font-size:14.5px}.wallet small{display:none}
  .login-btn{padding:8px 10px}
  .lobby-hero{padding-block:8px 20px;gap:14px}.lobby-hero h1{font-size:40px}.lobby-hero p{font-size:15px;margin:12px auto 18px}
  .hero-ctas{flex-direction:column;align-items:stretch;width:100%}.hero-ctas .btn{width:100%}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tiles .tile{grid-column:auto!important}
  .tiles .tile:first-child,.tiles .tile:nth-child(2){grid-column:1/-1!important;flex-direction:row}
  .tiles .tile:first-child .tile-art,.tiles .tile:nth-child(2) .tile-art{height:auto;width:96px;flex:none}
  .tile-art{height:84px;font-size:44px}
  .tile-body{padding:12px;gap:3px}.tile-body b{font-size:18px}.tile-body>span{font-size:12.5px;line-height:1.35}
  .tile-tag{font-size:10px!important}.tile-go{margin-top:2px;font-size:13px!important}
  .game-head{gap:10px;margin-bottom:10px}.game-head h2{font-size:28px}.game-head .mute{flex-basis:100%;font-size:13px}
  .wheel-wrap{width:min(250px,80vw)}
  .rl-top{gap:12px}.rl-result .num{font-size:38px}.bj-msg{font-size:19px;padding:8px 16px}.bj-msg.idle{font-size:15px}
  .controls{padding:12px;gap:12px}.controls .rack{width:100%;justify-content:space-between}
  .controls .ctl-btns{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .controls .ctl-btns .btn-lg{grid-column:1/-1}.controls .ctl-btns.play{grid-template-columns:1fr 1fr}.controls .ctl-btns.play .btn-lg{grid-column:auto}
  .table-felt{padding:12px}
  .sheet.lb{min-width:0;font-size:13px}.sheet.lb th:nth-child(n+5),.sheet.lb td:nth-child(n+5){display:none}
  .sheet.lb th,.sheet.lb td{padding:10px 6px}
  .sheet.tiers{min-width:0;font-size:13px}.sheet.tiers th,.sheet.tiers td{padding:10px 6px}
  .sheet.tiers td:first-child .chip{display:none}
  .vip-top{gap:14px}.tier-badge.big{padding:12px 16px}.tier-badge.big .ic{font-size:34px}.vip-txt h3{font-size:26px}
  .vip-top .btn{width:100%}
  .vip-meta span:first-child,.vip-meta span:last-child{display:none}
  .podium3{gap:8px}.pod{padding:12px 6px}
  .marquee{font-size:24px}
  .sec-h h2{font-size:30px!important}
  .side-layout{gap:12px}
  #crCanvas{height:320px}.crash-felt{min-height:340px}
  .mines-felt{min-height:0;padding:14px}.mines-grid{gap:7px}
  .felt{padding:16px}
  .mp-box{padding:20px}
  .room-code .code{letter-spacing:.18em}
}
.rl-board.vertical .stack.on-cell{font-size:10.5px;padding:1px 6px 1px 2px}.rl-board.vertical .stack.on-cell .chip-mini{width:14px;height:14px}
.rl-board.vertical .rl-cell.vert .stack.on-cell{top:auto;bottom:4px;transform:translateX(-50%)}
.upd-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:90;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:0;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1205;font-weight:800;box-shadow:0 14px 34px -10px #000,0 0 0 4px #e8b64733;animation:toastIn .5s cubic-bezier(.2,1.3,.4,1) both;max-width:calc(100% - 32px)}
</style>

/* ---------- Helpers ---------- */
const money=x=>(x<0?"-":"")+"$"+Math.abs(Math.round(x*100)/100);
const signed=x=>(x>0?"+":x<0?"":"")+money(x);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- State ---------- */
let S={screen:"home",seats:[{name:"Player 1",bot:false,type:"sole"},{name:"CPU 2",bot:true,type:"co"}]};
let ui={drawer:null};
const done=new Set();
const cur=()=>S.players[S.turn];

function newGame(){
  S.players=S.seats.map((s,i)=>{const t=typeOf(s.type);const c=t.start-t.reg;
    return {name:s.name.trim()||`Player ${i+1}`,bot:s.bot,type:s.type,cash:c,workers:1,machines:0,stars:0,public:false,hist:[c],color:SEAT_COLORS[i],lastProd:null}});
  S.rewarded=false;S.reward=0;S.round=1;S.custDeck=shuffle(CUSTOMERS.map((_,i)=>i));S.eventDeck=shuffle(EVENTS.map((_,i)=>i));S.brokeNext=false;done.clear();
  beginRound();
}
function beginRound(){
  if(!S.custDeck.length)S.custDeck=shuffle(CUSTOMERS.map((_,i)=>i));
  S.cust=S.custDeck.pop();S.machinesOff=S.brokeNext;S.brokeNext=false;S.market=null;
  S.players.forEach(p=>{p.rd=null;p.plan=null});S.turn=0;nextPlanner();
}
function nextPlanner(){
  while(S.turn<S.players.length&&S.players[S.turn].bot){botPlan(S.players[S.turn]);S.turn++}
  if(S.turn>=S.players.length){settle();return}
  const p=cur();S.peeked=false;S.pick=null;S.improve=false;S.superOn=true;S.buys=0;S.wentPublic=false;S.turnStart=p.cash;
  S.screen=S.players.filter(x=>!x.bot).length>1?"pass":"turn";render();
}
function lockIn(){
  const p=cur();p.plan={pick:S.pick,improve:S.improve,superOn:S.superOn,peeked:S.peeked,buys:S.buys,wentPublic:S.wentPublic,start:S.turnStart};
  S.turn++;nextPlanner();
}
const sumB=b=>b.reduce((a,x)=>a+x[1],0);
function botPlan(p){
  const c=CUSTOMERS[S.cust],start=p.cash;let peeked=false,wentPublic=false,buys=0;
  if(p.type==="co"&&!p.public&&p.cash<6){p.public=true;p.cash+=CFG.publicBonus;wentPublic=true}
  if(p.cash>=CFG.research){p.cash-=CFG.research;peeked=true}
  if(p.machines<CFG.maxMachines&&p.cash>=CFG.machineCost+CFG.wage+CFG.super){p.cash-=CFG.machineCost;p.machines++;buys++}
  p.workers=p.machines?CFG.maxWorkers:Math.min(CFG.maxWorkers,2);
  const others=S.players.length-1;let best=0,bv=-1e9;
  PRODUCTS.forEach((x,i)=>{const o={pick:i,improve:false,superOn:true},cs=costs(p,o);
    const pm=peeked?(x.seg===c.seg?1:0):.25,sellers=1+Math.round(others*Math.random()*.8);
    const win=cs.units*priceFor(p,o,true,sellers)+sumB(bonusFor(p,o,true))+CFG.starPts;
    const lose=cs.units*priceFor(p,o,false,1)+sumB(bonusFor(p,o,false));
    const v=pm*win+(1-pm)*lose-cs.costs+Math.random()*2.5;if(v>bv){bv=v;best=i}});
  const cs=costs(p,{pick:best,improve:false,superOn:true});
  const improve=peeked&&cs.units>=3&&p.cash>=CFG.improveCost;
  p.plan={pick:best,improve,superOn:true,peeked,buys,wentPublic,start};
}

/* ---------- Maths ---------- */
function costs(p,o){
  const mOK=p.machines>0&&(!S.machinesOff||T(o.pick,"garden"));
  let per=mOK?CFG.machineMult:1;
  if(T(o.pick,"bubble"))per=Math.max(per,3);
  if(T(o.pick,"bigphone"))per=1;
  const units=p.workers*per,wageEach=Math.max(0,CFG.wage+(T(o.pick,"headset")?1:0)-(T(o.pick,"bamboo")?1:0));
  const wages=p.workers*wageEach,sup=o.superOn?p.workers*CFG.super:0,fee=p.type==="part"?CFG.partFee:0;
  const imp=o.improve?(T(o.pick,"clothes")?0:CFG.improveCost):0;
  return {machinesWork:mOK,per,units,wages,sup,fee,imp,costs:wages+sup+fee+imp};
}
function crowdPrice(sellers){return CFG.crowdOn?Math.max(CFG.crowdFloor,CFG.matchPrice-CFG.crowdDrop*(sellers-1)):CFG.matchPrice}
function priceFor(p,o,match,sellers){
  let b;
  b=match?(T(o.pick,"lunchbox")?CFG.matchPrice:crowdPrice(sellers)):CFG.missPrice;
  if(T(o.pick,"cases"))b+=match?1:-1;
  if(T(o.pick,"bubble"))b-=1;
  if(T(o.pick,"headset"))b+=1;
  if(T(o.pick,"bigphone"))b*=2;
  if(o.improve)b+=CFG.improveBonus;
  return Math.max(0,b);
}
function bonusFor(p,o,match){
  const b=[];
  if(T(o.pick,"party")&&match)b.push(["Big Booking",CFG.partyBonus]);
  if(T(o.pick,"cafe")&&p.stars>0)b.push(["Regulars",Math.min(3,p.stars)]);
  if(T(o.pick,"vitamin")&&p.lastProd===o.pick)b.push(["Subscription",2]);
  return b;
}
function taxOn(p,profit){
  if(profit<=0)return 0;
  if(p.type==="co")return Math.floor(profit*CFG.coTaxPct/100);
  return profit>CFG.freeProfit?CFG.flatTax:0;
}
function rescue(p){if(p.type==="co"&&p.cash<=0){const was=p.cash;p.cash=CFG.coRescue;return was}return null}
function settle(){
  const c=CUSTOMERS[S.cust],sellers=S.players.filter(p=>PRODUCTS[p.plan.pick].seg===c.seg).length;
  S.market={sellers,rows:S.players.map(p=>{
    const o=p.plan,prod=PRODUCTS[o.pick],match=prod.seg===c.seg,cs=costs(p,o),price=priceFor(p,o,match,sellers),bon=bonusFor(p,o,match);
    const sales=cs.units*price,rev=sales+sumB(bon),profit=rev-cs.costs,noTax=T(o.pick,"bottle"),tax=noTax?0:taxOn(p,profit);
    const star=match;
    p.cash+=profit-tax;if(star)p.stars++;
    const rescued=rescue(p);
    p.rd={workers:p.workers,perWorker:cs.per,price,improved:o.improve,superPaid:o.superOn,product:o.pick};p.lastProd=o.pick;
    const upfront=(o.peeked?CFG.research:0)+o.buys*CFG.machineCost-(o.wentPublic?CFG.publicBonus:0);
    return {match,star,prod,price,sales,bon,rev,profit,tax,noTax:noTax&&profit>0,...cs,rescued,upfront,before:o.start,after:p.cash,improve:o.improve,superOn:o.superOn}
  })};
  S.screen="market";render();
}
function toEvent(){
  if(!S.eventDeck.length)S.eventDeck=shuffle(EVENTS.map((_,i)=>i));
  const ev=EVENTS[S.eventDeck.pop()],out=ev.apply(S.players);
  S.evRes={ev,evi:EVENTS.indexOf(ev),rows:S.players.map((p,i)=>{const o=out[i];const before=p.cash;if(o)p.cash+=o[0];const r=rescue(p);
    return {d:o?o[0]:null,note:o?o[1]:"Not affected",before,after:p.cash,rescued:r!==null}})};
  S.players.forEach(p=>p.hist.push(p.cash));
  S.screen="event";render();
}

function chart(){

  const x=i=>pl+(W-pl-pr)*i/n,y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g="";for(let v=lo;v<=hi;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)" font-family="JetBrains Mono,monospace">${v}</text>`;

}

function bumpWallet(delta){
  document.querySelectorAll(".wallet-amt").forEach(el=>{const from=+(el.dataset.v||me().bucks),to=me().bucks;el.dataset.v=to;
    const t0=performance.now();const tick=t=>{const k=Math.min(1,(t-t0)/600);el.textContent=fmtB(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);
    const w=el.closest(".wallet");if(w&&delta){w.classList.remove("up","down");void w.offsetWidth;w.classList.add(delta>0?"up":"down")}});
}

function coinBurst(n=60){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-8-Math.random()*10,r:6+Math.random()*6,s:Math.random()*6}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.s+=.2;const w=Math.abs(Math.cos(p.s))*p.r;
    x.fillStyle="#e8b647";x.beginPath();x.ellipse(p.x,p.y,w+1,p.r,0,0,6.29);x.fill();x.fillStyle="#ffdd85";x.beginPath();x.ellipse(p.x,p.y,Math.max(0,w-2),p.r-2,0,0,6.29);x.fill()});
    if(t-t0<2200)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);c.hidden=true}})(t0);
}

const seenCards=new Set();

  const red=c.s==="h"||c.s==="d",anim=seenCards.has(c.id)?"":"deal",face=["J","Q","K"].includes(c.r);

/* ---------- Blackjack ---------- */
const BJ={phase:"bet",bet:0,chip:25,shoe:[],dealer:[],hands:[],active:0,msg:"",last:0,seq:0,reveal:false,busy:false};
function newShoe(){const s=[];for(let d=0;d<6;d++)for(const su of "shdc")for(const r of RANKS)s.push({r,s:su});return shuffle(s)}
function drawC(){if(BJ.shoe.length<60)BJ.shoe=newShoe();return {...BJ.shoe.pop(),id:++BJ.seq}}
const cval=r=>r==="A"?11:["K","Q","J","10"].includes(r)?10:+r;
function htot(cards){let t=0,a=0;cards.forEach(c=>{t+=cval(c.r);if(c.r==="A")a++});while(t>21&&a){t-=10;a--}return {t,soft:a>0}}
const isBJ=h=>h.length===2&&htot(h).t===21;
const bjHand=()=>BJ.hands[BJ.active];
Object.assign(A,{
  bjChip(v){if(BJ.phase!=="bet"&&BJ.phase!=="done")return;if(BJ.phase==="done"){BJ.phase="bet";BJ.bet=0;BJ.hands=[];BJ.dealer=[];BJ.msg=""}
    if(BJ.bet+v>me().bucks){toast("Not enough Bucks for that chip","bad");return}BJ.chip=v;BJ.bet+=v;render()},
  bjClear(){if(BJ.phase==="bet"){BJ.bet=0;render()}},
  bjRebet(){const b=Math.min(BJ.last,me().bucks);if(b<10)return;BJ.phase="bet";BJ.bet=b;BJ.hands=[];BJ.dealer=[];BJ.msg="";A.bjDeal()},
  async bjDeal(){
    if(BJ.busy||BJ.phase!=="bet"||BJ.bet<10||BJ.bet>me().bucks)return;
    BJ.busy=true;bank(-BJ.bet);BJ.last=BJ.bet;BJ.hands=[{cards:[],bet:BJ.bet,done:false}];BJ.dealer=[];BJ.active=0;BJ.msg="";BJ.reveal=false;BJ.phase="deal";
    for(const who of ["p","d","p","d"]){(who==="p"?BJ.hands[0].cards:BJ.dealer).push(drawC());render();await sleep(380)}
    const up=cval(BJ.dealer[0].r);
    if((up>=10||isBJ(BJ.hands[0].cards))&&isBJ(BJ.dealer)){BJ.reveal=true;render();await sleep(500);return bjSettle()}
    if(isBJ(BJ.hands[0].cards)){BJ.hands[0].done=true;BJ.reveal=true;render();await sleep(500);return bjSettle()}
    BJ.phase="play";BJ.busy=false;render();
  },
  async bjHit(){if(BJ.phase!=="play"||BJ.busy)return;BJ.busy=true;const h=bjHand();h.cards.push(drawC());render();await sleep(320);
    const t=htot(h.cards).t;if(t>=21){h.done=true;await bjNext()}else{BJ.busy=false;render()}},
  async bjStand(){if(BJ.phase!=="play"||BJ.busy)return;BJ.busy=true;bjHand().done=true;await bjNext()},
  async bjDouble(){const h=bjHand();if(BJ.phase!=="play"||BJ.busy||h.cards.length!==2||me().bucks<h.bet)return;
    BJ.busy=true;bank(-h.bet);h.bet*=2;h.doubled=true;h.cards.push(drawC());render();await sleep(380);h.done=true;await bjNext()},
  async bjSplit(){const h=bjHand();if(!bjCanSplit())return;BJ.busy=true;bank(-h.bet);
    const c2=h.cards.pop(),aces=h.cards[0].r==="A";BJ.hands.push({cards:[c2],bet:h.bet,done:false,split:true});h.split=true;render();await sleep(250);
    for(const x of BJ.hands){x.cards.push(drawC());render();await sleep(320);if(aces)x.done=true}
    if(aces){await bjNext();return}
    if(htot(h.cards).t===21){h.done=true;await bjNext();return}
    BJ.busy=false;render()}
});
function bjCanSplit(){const h=bjHand();return BJ.phase==="play"&&!BJ.busy&&BJ.hands.length===1&&h.cards.length===2&&cval(h.cards[0].r)===cval(h.cards[1].r)&&me().bucks>=h.bet}
async function bjNext(){
  while(BJ.active<BJ.hands.length&&BJ.hands[BJ.active].done)BJ.active++;
  if(BJ.active<BJ.hands.length){const h=bjHand();if(h.cards.length===1){h.cards.push(drawC());render();await sleep(320)}
    if(htot(h.cards).t===21){h.done=true;return bjNext()}BJ.busy=false;render();return}
  BJ.phase="dealer";BJ.reveal=true;render();await sleep(650);
  if(BJ.hands.some(h=>htot(h.cards).t<=21)){while(htot(BJ.dealer).t<17){BJ.dealer.push(drawC());render();await sleep(520)}}
  bjSettle();
}
function bjSettle(){
  const d=htot(BJ.dealer).t,dBJ=isBJ(BJ.dealer);let stake=0,ret=0;const out=[];
  BJ.hands.forEach(h=>{const t=htot(h.cards).t,pBJ=isBJ(h.cards)&&!h.split;stake+=h.bet;let r=0,res;
    if(t>21){res="Bust"}else if(pBJ&&!dBJ){r=h.bet*2.5;res="Blackjack!"}else if(dBJ&&!pBJ){res="Dealer blackjack"}
    else if(d>21){r=h.bet*2;res="Dealer busts"}else if(t>d){r=h.bet*2;res="You win"}else if(t===d){r=h.bet;res="Push"}else res="Dealer wins";
    h.res=res;h.ret=r;ret+=r;out.push(res)});
  if(ret)bank(ret);record(stake,ret);
  const net=ret-stake;BJ.msg=net>0?`You win ${fmtB(net)}`:net<0?`You lose ${fmtB(-net)}`:"Push: bet returned";BJ.net=net;
  BJ.phase="done";BJ.busy=false;BJ.bet=BJ.last;render();if(net>0)coinBurst(net>=BJ.last*1.5?80:40);
}
function blackjack(){

     :`<div class="bj-zone"><div class="hand-row"><div class="pc ghost"></div><div class="pc ghost"></div></div><div class="bj-label">You ${chipStack(BJ.bet)}</div></div>`}</div>

/* ---------- Roulette ---------- */
const WHEEL=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const REDS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const colorOf=n=>n===0?"green":REDS.has(n)?"red":"black";
const RL={bets:{},chip:10,spinning:false,rot:0,ball:0,shownRot:0,shownBall:0,result:null,hist:[],last:null,msg:"",net:0,order:[]};
const rlTotal=()=>Object.values(RL.bets).reduce((a,b)=>a+b,0);
function rlReturn(k,n){
  if(k.startsWith("n"))return +k.slice(1)===n?36:0;
  if(n===0)return 0;
  const m={red:REDS.has(n),black:!REDS.has(n),odd:n%2===1,even:n%2===0,low:n<=18,high:n>18};
  if(k in m)return m[k]?2:0;
  if(k[0]==="d")return Math.ceil(n/12)===+k[1]?3:0;
  if(k[0]==="c")return ((n-1)%3)+1===+k[1]?3:0;
  return 0;
}
const RL_LABEL={red:"Red",black:"Black",odd:"Odd",even:"Even",low:"1 to 18",high:"19 to 36",d1:"1st 12",d2:"2nd 12",d3:"3rd 12",c1:"Bottom column",c2:"Middle column",c3:"Top column"};
Object.assign(A,{
  rlChip(v){RL.chip=v;render()},
  rlBet(k){if(RL.spinning)return;if(RL.result!=null&&!RL.order.length){RL.result=null;RL.msg=""}
    if(rlTotal()+RL.chip>me().bucks){toast("Not enough Bucks for that chip","bad");return}
    RL.bets[k]=(RL.bets[k]||0)+RL.chip;RL.order.push([k,RL.chip]);render()},
  rlUndo(){if(RL.spinning||!RL.order.length)return;const [k,v]=RL.order.pop();RL.bets[k]-=v;if(RL.bets[k]<=0)delete RL.bets[k];render()},
  rlClear(){if(RL.spinning)return;RL.bets={};RL.order=[];render()},
  rlRebet(){if(RL.spinning||!RL.last)return;const t=Object.values(RL.last).reduce((a,b)=>a+b,0);if(t>me().bucks){toast("Not enough Bucks to repeat that bet","bad");return}
    RL.bets={...RL.last};RL.order=Object.entries(RL.bets);RL.result=null;RL.msg="";render()},
  async rlSpin(){
    const stake=rlTotal();if(RL.spinning||stake<10||stake>me().bucks)return;
    RL.spinning=true;RL.msg="";bank(-stake);RL.last={...RL.bets};
    const n=WHEEL[Math.floor(Math.random()*37)],k=WHEEL.indexOf(n),a=360/37;
    const cur=((RL.rot%360)+360)%360,want=((360-k*a)%360+360)%360;RL.rot+=360*5+((want-cur+360)%360);
    RL.ball=Math.floor(RL.ball/360)*360-360*8;
    render();
    const w=document.getElementById("rlWheel"),b=document.getElementById("rlBall"),reduce=false;
    const spinTo=(el,from,to,ms,ease)=>{if(!el)return;if(el.animate&&!reduce){const an=el.animate([{transform:`rotate(${from}deg)`},{transform:`rotate(${to}deg)`}],{duration:ms,easing:ease,fill:"forwards"});an.onfinish=()=>{el.style.transform=`rotate(${to}deg)`}}else el.style.transform=`rotate(${to}deg)`};
    spinTo(w,RL.shownRot,RL.rot,5200,"cubic-bezier(.12,.6,.12,1)");spinTo(b,RL.shownBall,RL.ball,5500,"cubic-bezier(.2,.7,.15,1)");
    await sleep(5600);RL.shownRot=RL.rot;RL.shownBall=RL.ball;
    let ret=0;const wins=[];Object.entries(RL.bets).forEach(([key,v])=>{const r=rlReturn(key,n)*v;if(r){ret+=r;wins.push(key)}});
    if(ret)bank(ret);record(stake,ret);
    RL.result=n;RL.hist.unshift(n);RL.hist=RL.hist.slice(0,14);RL.net=ret-stake;RL.wins=wins;
    RL.msg=RL.net>0?`You win ${fmtB(RL.net)}`:RL.net<0?`You lose ${fmtB(-RL.net)}`:"You broke even";
    RL.bets={};RL.order=[];RL.spinning=false;render();if(RL.net>0)coinBurst(RL.net>=stake*5?90:45);
  }
});
function wheelSvg(){
  const a=360/37,R=140,r0=96,pt=(ang,rad)=>[Math.sin(ang*Math.PI/180)*rad,-Math.cos(ang*Math.PI/180)*rad];

   <path d="M-9 -160 9 -160 0 -143Z" fill="#ffdd85" stroke="#0b0a07" stroke-width="1.5"/></svg>`;

function roulette(){
  const t=rlTotal(),cell=(k,label,cls="",pos="")=>`<button class="rl-cell ${cls} ${RL.result!=null&&RL.wins?.includes(k)?"hit":""}" style="${pos}" data-a="rlBet" data-v="${k}" aria-label="Bet on ${RL_LABEL[k]||label}${RL.bets[k]?`, ${RL.bets[k]} placed`:""}">${label}${RL.bets[k]?chipStack(RL.bets[k],"on-cell"):""}</button>`;
  if(typeof window!=="undefined"&&window.innerWidth<700){let v="";

function betBox(k,dis){return `<div class="betbox"><label for="bet_${k}">Bet amount</label><div class="bb-row"><span class="pre">${ic("coins")}</span>
  <input id="bet_${k}" type="number" min="1" step="1" inputmode="numeric" value="${BETS[k]}" data-bet="${k}" ${dis?"disabled":""}>
  <button class="mini" data-a="betMul" data-v="${k},0.5" ${dis?"disabled":""}>½</button><button class="mini" data-a="betMul" data-v="${k},2" ${dis?"disabled":""}>2×</button></div></div>`}
if(typeof document!=="undefined"&&document.addEventListener)document.addEventListener("input",e=>{const k=e.target?.dataset?.bet;if(k)BETS[k]=Math.max(1,Math.floor(+e.target.value||1))});
A.betMul=function(k,m){BETS[k]=Math.max(1,Math.min(me().bucks||1,Math.floor(BETS[k]*m)));SFX.chip();const el=document.getElementById("bet_"+k);if(el)el.value=BETS[k];else render()};
function takeBet(k){const b=BETS[k];if(!(b>=1)){toast("Enter a bet of at least 1","bad");return 0}if(b>me().bucks){toast("Not enough Bucks for that bet","bad");return 0}bank(-b);return b}

/* ---------- Mines ---------- */
const MN={mines:3,state:"idle",open:[],set:null,picks:0,stake:0,ret:0,hit:-1};
const mnMult=(m,k)=>{let x=.97;for(let i=0;i<k;i++)x*=(25-i)/(25-m-i);return x};
Object.assign(A,{
  mnMines(n){if(MN.state==="live")return;MN.mines=Math.max(1,Math.min(24,n));SFX.click();render()},
  mnStart(){if(MN.state==="live")return;const s=takeBet("mines");if(!s)return;MN.stake=s;MN.state="live";MN.picks=0;MN.hit=-1;MN.ret=0;MN.open=Array(25).fill(false);
    const idx=shuffle([...Array(25).keys()]);MN.set=new Set(idx.slice(0,MN.mines));SFX.whoosh();render()},
  mnPick(i){if(MN.state!=="live"||MN.open[i])return;MN.open[i]=true;
    if(MN.set.has(i)){MN.hit=i;MN.state="lost";record(MN.stake,0);SFX.boom();render();document.querySelector(".mines-grid")?.classList.add("shake");return}
    MN.picks++;SFX.gem(MN.picks);if(MN.picks===25-MN.mines){A.mnCash();return}render()},
  mnRandom(){if(MN.state!=="live")return;const c=[...Array(25).keys()].filter(i=>!MN.open[i]);A.mnPick(c[Math.floor(Math.random()*c.length)])},
  mnCash(){if(MN.state!=="live"||!MN.picks)return;MN.ret=Math.floor(MN.stake*mnMult(MN.mines,MN.picks));bank(MN.ret);record(MN.stake,MN.ret);MN.state="won";
    SFX.win(MN.ret>=MN.stake*5?3:2);coinBurst(MN.ret>=MN.stake*5?90:45);render()}
});
function mines(){
  const live=MN.state==="live",cur=mnMult(MN.mines,MN.picks),nxt=mnMult(MN.mines,MN.picks+1),over=MN.state==="lost"||MN.state==="won";
  const tiles=[...Array(25).keys()].map(i=>{const open=MN.open[i],mine=MN.set?.has(i),show=open||(over&&MN.set);
    const cls=show?(mine?"mine":"gem"):"";return `<button class="mtile ${cls} ${open?"opened":"ghosted"} ${i===MN.hit?"boom":""}" data-a="mnPick" data-v="${i}" ${live&&!open?"":"disabled"} aria-label="Tile ${i+1}${show?(mine?", mine":", gem"):""}">${show?ic(mine?"bomb":"gem"):""}</button>`}).join("");
  return `<div class="screen">${cHead()}
  <div class="game-head"><button class="btn btn-ghost sm" data-a="go" data-v="home">${ic("home")} Lobby</button><h2>Mines</h2><span class="mute">Find gems, dodge mines, cash out any time</span></div>
  ${brokeBanner()}
  <div class="side-layout">
   <aside class="felt side">
    ${betBox("mines",live)}
    <div><label class="lbl2">Mines</label><div class="seg wrap">${[1,3,5,10,15,24].map(n=>`<button class="${MN.mines===n?"on":""}" data-a="mnMines" data-v="${n}" ${live?"disabled":""}>${n}</button>`).join("")}</div></div>
    <div class="readout"><div><small>Multiplier</small><b class="num">${live||MN.state==="won"?(MN.state==="won"?mnMult(MN.mines,MN.picks):cur).toFixed(2):"1.00"}x</b></div><div><small>Next gem</small><b class="num">${nxt.toFixed(2)}x</b></div>
     <div><small>${live?"Cash out for":"Last result"}</small><b class="num ${MN.state==="won"?"pos":MN.state==="lost"?"neg":""}">${live?fmtB(Math.floor(MN.stake*cur)):MN.state==="won"?`+${fmtB(MN.ret-MN.stake)}`:MN.state==="lost"?`-${fmtB(MN.stake)}`:"-"}</b></div></div>
    ${live?`<button class="btn btn-gold btn-lg" data-a="mnCash" ${MN.picks?"":"disabled"}>${ic("coins")} Cash out ${MN.picks?fmtB(Math.floor(MN.stake*cur)):""}</button><button class="btn btn-ghost" data-a="mnRandom">${ic("shuffle")} Pick a random tile</button>`
     :`<button class="btn btn-gold btn-lg" data-a="mnStart">${ic("play")} ${over?"Play again":"Start"}</button>`}
   </aside>
   <section class="table-felt mines-felt"><div class="mines-grid">${tiles}</div>
    ${MN.state==="lost"?`<div class="over-msg lose">${ic("bomb")} Boom! You hit a mine</div>`:MN.state==="won"?`<div class="over-msg win">${ic("gem")} Cashed out ${fmtB(MN.ret)} at ${mnMult(MN.mines,MN.picks).toFixed(2)}x</div>`:""}</section>
  </div></div>`;
}

/* ---------- Crash ---------- */
const CR={state:"idle",stake:0,auto:2,cp:1,t0:0,m:1,cashAt:0,hist:[],raf:0};
const CR_K=.11;
const crPoint=()=>{const r=Math.random();return Math.max(1,Math.floor(97/(1-r))/100)};
Object.assign(A,{
  crAuto(v){CR.auto=v;SFX.click();render()},
  crStart(){if(CR.state==="run"||CR.state==="cashed")return;const s=takeBet("crash");if(!s)return;CR.stake=s;CR.cp=crPoint();CR.cashAt=0;CR.m=1;CR.state="run";CR.t0=performance.now();SFX.whoosh();render();crLoop()},
  crCash(){if(CR.state!=="run")return;CR.cashAt=Math.floor(CR.m*100)/100;const ret=Math.floor(CR.stake*CR.cashAt);bank(ret);record(CR.stake,ret);CR.ret=ret;CR.state="cashed";SFX.win(CR.cashAt>=5?3:2);coinBurst(CR.cashAt>=5?80:40);crPaint()}
});
function crLoop(){
  const t=(performance.now()-CR.t0)/1000,m=Math.exp(CR_K*t);
  if(m>=CR.cp){CR.m=CR.cp;const lost=CR.state==="run";CR.state="crashed";CR.hist.unshift({cp:CR.cp,won:!lost});CR.hist=CR.hist.slice(0,12);if(lost){record(CR.stake,0);SFX.boom()}else SFX.thunk();render();return}
  CR.m=m;if(CR.state==="run"&&CR.auto>1&&m>=CR.auto)A.crCash();
  crPaint();CR.raf=requestAnimationFrame(crLoop);
}
function crPaint(){
  const cv=document.getElementById("crCanvas");const el=document.getElementById("crMult");if(el){el.textContent=CR.m.toFixed(2)+"x";el.className="cr-mult num "+(CR.state==="crashed"?"crashed":CR.state==="cashed"?"cashed":"")}
  const cb=document.getElementById("crCash");if(cb){cb.disabled=CR.state!=="run";cb.innerHTML=`${ic("coins")} ${CR.state==="run"?`Cash out ${fmtB(Math.floor(CR.stake*CR.m))}`:CR.state==="cashed"?`Cashed ${fmtB(CR.ret)} at ${CR.cashAt.toFixed(2)}x`:"Cash out"}`}
  if(!cv)return;const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const t=Math.log(CR.m)/CR_K,tMax=Math.max(8,t*1.15),mMax=Math.max(2,CR.m*1.2),pl=44,pb=28,pt=16,pr=16;
  const X=s=>pl+(W-pl-pr)*s/tMax,Y=v=>H-pb-(H-pb-pt)*(v-1)/(mMax-1);
  x.strokeStyle="#ffffff14";x.fillStyle="#a0957a";x.font="11px JetBrains Mono, monospace";x.textAlign="right";
  const step=mMax>20?5:mMax>8?2:mMax>4?1:.5;for(let v=1;v<=mMax;v+=step){x.beginPath();x.moveTo(pl,Y(v));x.lineTo(W-pr,Y(v));x.stroke();x.fillText(v.toFixed(v%1?1:0)+"x",pl-6,Y(v)+4)}
  x.textAlign="center";const ts=tMax>30?10:tMax>14?4:2;for(let s=0;s<=tMax;s+=ts)x.fillText(s+"s",X(s),H-8);
  const col=CR.state==="crashed"&&!CR.cashAt?"#ef6a58":"#e8b647";
  const g=x.createLinearGradient(0,H,0,0);g.addColorStop(0,col+"00");g.addColorStop(1,col+"55");
  x.beginPath();x.moveTo(X(0),Y(1));for(let s=0;s<=t;s+=t/80||1)x.lineTo(X(s),Y(Math.exp(CR_K*s)));x.lineTo(X(t),Y(CR.m));x.lineTo(X(t),Y(1));x.closePath();x.fillStyle=g;x.fill();
  x.beginPath();x.moveTo(X(0),Y(1));for(let s=0;s<=t;s+=t/80||1)x.lineTo(X(s),Y(Math.exp(CR_K*s)));x.lineTo(X(t),Y(CR.m));x.strokeStyle=col;x.lineWidth=3.5;x.shadowColor=col;x.shadowBlur=14;x.stroke();x.shadowBlur=0;
  x.beginPath();x.arc(X(t),Y(CR.m),6,0,7);x.fillStyle=col;x.fill();
  if(CR.cashAt){const tc=Math.log(CR.cashAt)/CR_K;x.beginPath();x.arc(X(tc),Y(CR.cashAt),7,0,7);x.fillStyle="#58c98a";x.fill();x.fillStyle="#58c98a";x.font="700 12px Manrope, sans-serif";x.textAlign="left";x.fillText(`Cashed ${CR.cashAt.toFixed(2)}x`,X(tc)+10,Y(CR.cashAt)-8)}
}
function crash(){
  const run=CR.state==="run"||CR.state==="cashed";
  return `<div class="screen">${cHead()}
  <div class="game-head"><button class="btn btn-ghost sm" data-a="go" data-v="home">${ic("home")} Lobby</button><h2>Crash</h2><span class="mute">Cash out before it crashes</span></div>
  ${brokeBanner()}
  <div class="side-layout">
   <aside class="felt side">
    ${betBox("crash",run)}
    <div><label class="lbl2">Auto cash out</label><div class="seg wrap">${[[0,"Off"],[1.5,"1.5x"],[2,"2x"],[3,"3x"],[5,"5x"],[10,"10x"]].map(([v,l])=>`<button class="${CR.auto===v?"on":""}" data-a="crAuto" data-v="${v}" ${run?"disabled":""}>${l}</button>`).join("")}</div></div>
    ${run?`<button id="crCash" class="btn btn-gold btn-lg" data-a="crCash">${ic("coins")} Cash out</button>`:`<button class="btn btn-gold btn-lg" data-a="crStart">${ic("rocket")} Launch</button>`}
    <div><label class="lbl2">Recent crashes</label><div class="hist">${CR.hist.map(h=>`<span class="h ${h.cp>=2?"hi":"lo"}">${h.cp.toFixed(2)}</span>`).join("")||`<span class="mute" style="font-size:13px">None yet</span>`}</div></div>
   </aside>
   <section class="table-felt crash-felt"><canvas id="crCanvas" aria-label="Crash multiplier chart"></canvas>
    <div class="cr-over"><div id="crMult" class="cr-mult num ${CR.state==="crashed"?"crashed":CR.state==="cashed"?"cashed":""}">${CR.m.toFixed(2)}x</div>
     <div class="cr-sub">${CR.state==="crashed"?(CR.cashAt?`You cashed out at ${CR.cashAt.toFixed(2)}x · +${fmtB(CR.ret-CR.stake)}`:`Crashed. You lost ${fmtB(CR.stake)}`):CR.state==="idle"?"Set a bet and launch":""}</div></div></section>
  </div></div>`;
}

/* ---------- Plinko ---------- */
const PK_ROWS=12,PK_TABLES={low:[10,3,1.6,1.4,1.1,1,.5,1,1.1,1.4,1.6,3,10],med:[33,11,4,2,1.1,.6,.3,.6,1.1,2,4,11,33],high:[170,24,8.1,2,.7,.2,.2,.2,.7,2,8.1,24,170]};
const PK={risk:"med",balls:[],raf:0,last:[],flash:{}};
Object.assign(A,{
  pkRisk(r){if(PK.balls.length)return;PK.risk=r;SFX.click();render()},
  pkDrop(){const s=takeBet("plinko");if(!s)return;const path=Array.from({length:PK_ROWS},()=>Math.random()<.5?0:1);
    PK.balls.push({path,slot:path.reduce((a,b)=>a+b,0),stake:s,t0:performance.now(),row:-1,tbl:PK_TABLES[PK.risk]});SFX.chip();if(!PK.raf)PK.raf=requestAnimationFrame(pkLoop)}
});
const PK_ROW_MS=150;
function pkGeom(cv){const W=cv.clientWidth,H=cv.clientHeight,gap=Math.min(W/(PK_ROWS+3),(H-30)/(PK_ROWS+1.5)),cx=W/2,top=gap*.9;return {W,H,gap,cx,top}}
function pkLoop(now){
  const cv=document.getElementById("pkCanvas");
  PK.balls.forEach(b=>{const r=Math.floor((now-b.t0)/PK_ROW_MS);if(r!==b.row&&r>=0&&r<PK_ROWS){b.row=r;SFX.tick()}
    if(!b.done&&now-b.t0>=PK_ROW_MS*(PK_ROWS+1)){b.done=true;const mult=b.tbl[b.slot],ret=Math.floor(b.stake*mult*100)/100,retR=Math.round(ret);
      if(retR)bank(retR);record(b.stake,retR);PK.flash[b.slot]=now;PK.last.unshift({m:mult,slot:b.slot});PK.last=PK.last.slice(0,10);
      if(mult>=2)SFX.win(mult>=10?3:2);else if(mult>=1)SFX.coin();else SFX.thunk();if(mult>=10)coinBurst(60);pkSide()}});
  PK.balls=PK.balls.filter(b=>!b.done);
  if(cv)pkPaint(cv,now);
  if(PK.balls.length||Object.values(PK.flash).some(t=>now-t<600))PK.raf=requestAnimationFrame(pkLoop);else{PK.raf=0;if(cv)pkPaint(cv,now)}
}
function pkPaint(cv,now){
  const dpr=Math.min(2,window.devicePixelRatio||1);if(cv.width!==cv.clientWidth*dpr){cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr}
  const x=cv.getContext("2d"),{W,H,gap,cx,top}=pkGeom(cv);x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  for(let r=0;r<PK_ROWS;r++)for(let j=0;j<r+3;j++){const px=cx+(j-(r+2)/2)*gap,py=top+r*gap;x.beginPath();x.arc(px,py,Math.max(2.5,gap*.09),0,7);x.fillStyle="#f4ecd6cc";x.fill()}
  PK.balls.forEach(b=>{const e=(now-b.t0)/PK_ROW_MS,r=Math.min(PK_ROWS,Math.floor(e)),f=Math.min(1,e-Math.floor(e));
    let off=0;for(let i=0;i<r&&i<PK_ROWS;i++)off+=b.path[i]?.5:-.5;const nOff=r<PK_ROWS?off+(b.path[r]?.5:-.5):off;
    const bx=cx+(off+(nOff-off)*f)*gap,by=top+(r-1)*gap+gap*f-Math.sin(f*Math.PI)*gap*.35-gap*.5;
    x.beginPath();x.arc(bx,Math.min(by,H-12),Math.max(5,gap*.22),0,7);const g=x.createRadialGradient(bx-2,by-2,1,bx,by,gap*.25);g.addColorStop(0,"#fff3c4");g.addColorStop(1,"#c8902a");x.fillStyle=g;x.shadowColor="#e8b647";x.shadowBlur=12;x.fill();x.shadowBlur=0});
  document.querySelectorAll(".pk-slot").forEach((el,i)=>el.classList.toggle("flash",!!PK.flash[i]&&now-PK.flash[i]<600));
}
function pkSide(){const el=document.getElementById("pkLast");if(el)el.innerHTML=pkLastHtml()}
const pkLastHtml=()=>PK.last.map(l=>`<span class="h ${l.m>=2?"hi":l.m>=1?"mid":"lo"}">${l.m}x</span>`).join("")||`<span class="mute" style="font-size:13px">Drop a ball</span>`;
function pkColor(m){return m>=10?"#ef6a58":m>=3?"#f39b4a":m>=1.4?"#e8b647":m>=1?"#b9a56a":"#6d6450"}
function plinko(){
  const tbl=PK_TABLES[PK.risk];
  return `<div class="screen">${cHead()}
  <div class="game-head"><button class="btn btn-ghost sm" data-a="go" data-v="home">${ic("home")} Lobby</button><h2>Plinko</h2><span class="mute">Drop balls through the pegs</span></div>
  ${brokeBanner()}
  <div class="side-layout">
   <aside class="felt side">
    ${betBox("plinko",false)}
    <div><label class="lbl2">Risk</label><div class="seg wrap">${[["low","Low"],["med","Medium"],["high","High"]].map(([v,l])=>`<button class="${PK.risk===v?"on":""}" data-a="pkRisk" data-v="${v}">${l}</button>`).join("")}</div></div>
    <button class="btn btn-gold btn-lg" data-a="pkDrop">${ic("plinko")} Drop ball</button>
    <div><label class="lbl2">Last results</label><div class="hist" id="pkLast">${pkLastHtml()}</div></div>
   </aside>
   <section class="table-felt pk-felt"><canvas id="pkCanvas" aria-label="Plinko board"></canvas>
    <div class="pk-slots">${tbl.map((m,i)=>`<span class="pk-slot" style="--sc:${pkColor(m)}">${m}x</span>`).join("")}</div></section>
  </div></div>`;
}
